[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizdoom-autoqa"
version = "0.1.0"
description = "Meta-only ViZDoom research feasibility checks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vizdoom==1.3.2",
  "openai>=1.60",
  "meta-sam-parser>=0.1.0",
  "pillow>=11",
  "numpy>=2",
  "imageio[ffmpeg]>=2.37",
  "pyyaml>=6",
  "pydantic>=2",
  "python-dotenv>=1",
]

[project.scripts]
autoqa = "autoqa.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live_api'"
markers = ["live_api: explicit live Meta API checks (requires credentials and network)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["autoqa"]
